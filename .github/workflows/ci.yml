name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Contract tests
        run: npm run test:contracts

      - name: Unit tests
        run: npm test

      - name: Check that the Python script compiles
        run: python3 -m py_compile scripts/register_file.py

      # GitHub sets CI=true, so react-scripts treats build warnings as errors.
      - name: Build
        run: npm run build
